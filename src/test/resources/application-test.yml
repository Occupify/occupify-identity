spring:
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci1zaWduaW5nLW11c3QtYmUtbG9uZy1lbm91Z2gtZm9yLWhzNTEyLWFsZ29yaXRobS1taW5pbXVtLTY0LWJ5dGVzIQ==
    access-token-expiration: 3600000
    refresh-token-expiration: 604800000
  otp:
    length: 6
    expiration-seconds: 300
    max-attempts: 3
    cooldown-seconds: 60
  rabbitmq:
    exchange: occupify.notification.exchange
    user-registered-routing-key: user.registered
    password-reset-routing-key: user.password-reset

