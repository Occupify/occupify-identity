server:
  port: ${SERVER_PORT:8181}

spring:
  application:
    name: occupify-identity-gateway
  cloud:
    gateway:
      routes:
        # Core Marketplace Service (:8182)
        - id: core-service
          uri: ${SERVICES_CORE_URL}
          predicates:
            - Path=/projects/**, /applications/**, /reviews/**, /bids/**

        # Payment Service (:8183)
        - id: payment-service
          uri: ${SERVICES_PAYMENT_URL}
          predicates:
            - Path=/contracts/**, /wallets/**, /payments/**

        # Notification Service (:8184)
        - id: notification-service
          uri: ${SERVICES_NOTIFICATION_URL}
          predicates:
            - Path=/notifications/**

        # Administration Service (:8185)
        - id: administration-service
          uri: ${SERVICES_ADMINISTRATION_URL}
          predicates:
            - Path=/admin/**, /audit-logs/**, /reports/**

        # Identity / Auth routes
        - id: auth-service
          uri: ${SERVICES_AUTH_URL}
          predicates:
            - Path=/auth/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
