server:
  port: ${SERVER_PORT:8181}

spring:
  application:
    name: occupify-identity
  config:
    import: optional:file:.env[.properties]

  # --- PostgreSQL DataSource Configuration (JDBC) ---
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5530}/${POSTGRES_DB:occupify_identity}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # --- Spring Data JPA / Hibernate Configuration ---
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # --- Flyway Database Migration Configuration ---
  flyway:
    enabled: true
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5530}/${POSTGRES_DB:occupify_identity}
    user: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true

  # --- Redis Configuration ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # --- RabbitMQ Configuration ---
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Application Specific JWT, OTP & RabbitMQ Properties
app:
  jwt:
    secret: ${JWT_SECRET:secret-jwt-key-for-signing-must-be-long-enough-for-hs512-algorithm-minimum-64-bytes!}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

  otp:
    length: ${OTP_LENGTH:6}
    expiration-seconds: ${OTP_EXPIRATION_SECONDS:300}
    max-attempts: ${OTP_MAX_ATTEMPTS:3}
    cooldown-seconds: ${OTP_COOLDOWN_SECONDS:60}

  rabbitmq:
    exchange: ${RABBITMQ_NOTIFICATION_EXCHANGE:occupify.notification.exchange}
    user-registered-routing-key: ${RABBITMQ_USER_REGISTERED_ROUTING_KEY:user.registered}
    password-reset-routing-key: ${RABBITMQ_PASSWORD_RESET_ROUTING_KEY:user.password-reset}

