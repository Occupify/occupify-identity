server:
  port: ${SERVER_PORT:8181}

spring:
  application:
    name: occupify-identity
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:identity.env[.properties]

  web:
    resources:
      add-mappings: true
      static-locations: classpath:/static/

  # --- File Upload Configuration ---
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  # --- PostgreSQL DataSource Configuration (JDBC) ---
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5530}/${POSTGRES_DB:occupify_identity}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # --- Spring Data JPA / Hibernate Configuration ---
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # --- Flyway Database Migration Configuration ---
  flyway:
    enabled: true
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5530}/${POSTGRES_DB:occupify_identity}
    user: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true

  # --- Redis Configuration ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # --- RabbitMQ Configuration ---
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Application Specific JWT, OTP & RabbitMQ Properties
app:
  jwt:
    secret: ${JWT_SECRET:secret-jwt-key-for-signing-must-be-long-enough-for-hs512-algorithm-minimum-64-bytes!}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

  otp:
    length: ${OTP_LENGTH:6}
    expiration-seconds: ${OTP_EXPIRATION_SECONDS:900}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    cooldown-seconds: ${OTP_COOLDOWN_SECONDS:5}

  rabbitmq:
    exchange: ${RABBITMQ_NOTIFICATION_EXCHANGE:occupify.notification.exchange}
    user-exchange: ${RABBITMQ_USER_EXCHANGE:occupify.user.exchange}
    user-registered-routing-key: ${RABBITMQ_USER_REGISTERED_ROUTING_KEY:user.registered}
    user-activated-routing-key: ${RABBITMQ_USER_ACTIVATED_ROUTING_KEY:user.activated}
    password-reset-routing-key: ${RABBITMQ_PASSWORD_RESET_ROUTING_KEY:user.password-reset}
    contract-exchange: ${RABBITMQ_CONTRACT_EXCHANGE:occupify.contract.exchange}
    contract-queue: ${RABBITMQ_CONTRACT_QUEUE:occupify.identity.contract.queue}
    contract-accepted-routing-key: ${RABBITMQ_CONTRACT_ACCEPTED_ROUTING_KEY:contract.accepted}
    contract-rejected-routing-key: ${RABBITMQ_CONTRACT_REJECTED_ROUTING_KEY:contract.rejected}
    contract-compensation-routing-key: ${RABBITMQ_CONTRACT_COMPENSATION_ROUTING_KEY:contract.compensation.#}

  storage:
    s3:
      bucket-namespace: ${S3_BUCKET_NAMESPACE:}
      region: ${S3_REGION:ap-singapore-1}
      endpoint: ${S3_ENDPOINT:}
      bucket-name: ${S3_BUCKET_NAME:occupify-storage}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      public-url-prefix: ${S3_PUBLIC_URL_PREFIX:}
      path-style-access-enabled: ${S3_PATH_STYLE_ACCESS_ENABLED:true}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
scalar:
  path: ${SCALAR_PATH:/docs}
  url: ${SCALAR_URL:/v3/api-docs}
  enabled: ${SCALAR_ENABLED:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true


